[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-radar"
version = "0.1.0"
description = "Personal academic and industry opportunity intelligence system"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "certifi>=2024.7.4,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.8,<1",
]
sheets = [
  "google-api-python-client>=2.0,<3",
  "google-auth>=2.0,<3",
  "google-auth-oauthlib>=1.0,<2",
]

[project.scripts]
research-radar = "research_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live_google_sheets: opt-in read-only test requiring configured Google credentials",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
